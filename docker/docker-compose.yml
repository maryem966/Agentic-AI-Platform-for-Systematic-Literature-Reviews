  #     - "7474:7474"   # HTTP Browser
  #     - "7687:7687"   # Bolt
  #   volumes:
  #     - neo4j_data:/data
  #     - neo4j_logs:/logs
  #   healthcheck:
  #     test: ["CMD-SHELL", "cypher-shell -u neo4j -p changeme 'RETURN 1'"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5

volumes:
  postgres_data:
  qdrant_data:
