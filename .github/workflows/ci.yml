name: CI — SLR-Nexus

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  # Vérifie la combinaison critique épinglée avant d'ajouter des dépendances métier.
  dependency-compatibility:
    name: "Compatibilité versions critiques"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned orchestration stack
        run: pip install pydantic==2.9.2 pydantic-settings==2.6.1 httpx==0.27.2 ollama==0.4.2 groq==0.12.0 langchain==0.3.7 langchain-core==0.3.15 langchain-community==0.3.5 langchain-ollama==0.2.0 langchain-groq==0.2.1 langgraph==0.2.42 langgraph-checkpoint==2.0.6 langgraph-checkpoint-postgres==2.0.6
      - name: Check dependency resolution and imports
        run: |
          pip check
          python -c "import pydantic, langchain, langgraph; from langchain_ollama import ChatOllama; from langchain_groq import ChatGroq; print('critical stack imports OK')"

  # --------------------------------------------------------
  # Job 1 : Lint — Ruff + Mypy
  # --------------------------------------------------------
  lint:
    name: "Lint (ruff + mypy)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install lint dependencies
        run: |
          pip install --upgrade pip
          pip install ruff==0.8.1 mypy==1.13.0 pydantic==2.9.2 pydantic-settings==2.6.1

      - name: Ruff — lint
        run: ruff check src/

      - name: Ruff — format check
        run: ruff format --check src/

      - name: Mypy — domaine (strict)
        run: mypy src/domain/ --ignore-missing-imports --disallow-untyped-defs

  # --------------------------------------------------------
  # Job 2 : Vérification isolation domaine
  # --------------------------------------------------------
  domain-isolation:
    name: "Isolation domaine (0 import externe)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check domain imports
        run: python scripts/check_domain_imports.py

  # --------------------------------------------------------
  # Job 3 : Tests unitaires
  # --------------------------------------------------------
  unit-tests:
    name: "Tests unitaires et adapters"
    runs-on: ubuntu-latest
    needs: [lint, domain-isolation, dependency-compatibility]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install test dependencies
        run: |
          pip install --upgrade pip
          pip install pytest==8.3.4 pytest-asyncio==0.24.0 pytest-cov==6.0.0 aiosqlite==0.20.0 pydantic==2.9.2 pydantic-settings==2.6.1 sqlalchemy==2.0.36 alembic==1.14.0 qdrant-client==1.12.1 ollama==0.4.2 groq==0.12.0 httpx==0.27.2

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short --cov=src/domain --cov-report=term-missing

      - name: Check coverage (domaine > 80%)
        run: pytest tests/unit/ --cov=src/domain --cov-fail-under=80 -q
