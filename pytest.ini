[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
asyncio_mode = auto
markers =
    unit: Tests unitaires sans dépendances externes
    integration: Tests d'intégration avec services réels
    agents: Tests des contrats d'agents
    evaluation: Tests d'évaluation sur Golden Dataset
    slow: Tests lents (> 5 secondes)
